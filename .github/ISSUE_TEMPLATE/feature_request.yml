name: "功能需求"
description: "提出一个新功能或改进建议，帮助我们规划迭代。"
title: "[Feature] "
labels:
  - "enhancement"
body:
  - type: "textarea"
    id: "background"
    attributes:
      label: "需求背景"
      description: "当前遇到了什么问题，或为什么会有这个需求？"
      placeholder: "例如：整理多篇笔记时，缺少批量标签能力导致效率较低。"
    validations:
      required: true
  - type: "textarea"
    id: "audience"
    attributes:
      label: "目标用户或使用场景"
      description: "这个需求主要服务哪些用户、在哪些场景下使用？"
      placeholder: "例如：重度写作者在每周复盘时需要快速整理一组草稿。"
    validations:
      required: true
  - type: "textarea"
    id: "proposal"
    attributes:
      label: "期望方案"
      description: "你心中的理想交互或功能表现是什么？"
      placeholder: "例如：在列表页支持多选，并对选中笔记批量添加或移除标签。"
    validations:
      required: true
  - type: "textarea"
    id: "alternatives"
    attributes:
      label: "备选方案"
      description: "是否考虑过其他替代方案、临时方案或现有绕过方式？"
      placeholder: "例如：目前只能逐条编辑，也可以先从详情页入口开始。"
    validations:
      required: false
  - type: "textarea"
    id: "acceptance"
    attributes:
      label: "验收标准"
      description: "如何判断这个需求已经完成并达到预期？"
      placeholder: |
        - 可以在列表页选择多条笔记
        - 支持批量添加标签
        - 支持批量移除标签
        - 操作后界面反馈明确
    validations:
      required: true
  - type: "textarea"
    id: "extra"
    attributes:
      label: "补充信息"
      description: "其他背景资料、参考案例、设计稿或相关链接。"
      placeholder: "可附上竞品示例、原型或讨论记录。"
    validations:
      required: false
